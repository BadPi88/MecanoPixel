<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="heart-full" viewBox="0 0 16 16">
    <rect x="4" y="2" width="2" height="2" fill="currentColor"/>
    <rect x="10" y="2" width="2" height="2" fill="currentColor"/>
    <rect x="2" y="4" width="12" height="2" fill="currentColor"/>
    <rect x="2" y="6" width="12" height="2" fill="currentColor"/>
    <rect x="4" y="8" width="8" height="2" fill="currentColor"/>
    <rect x="6" y="10" width="4" height="2" fill="currentColor"/>
    <rect x="7" y="12" width="2" height="2" fill="currentColor"/>
  </symbol>
  <symbol id="heart-empty" viewBox="0 0 16 16">
    <rect x="4" y="2" width="2" height="2" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="10" y="2" width="2" height="2" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="2" y="4" width="12" height="8" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="6" y="10" width="4" height="2" fill="none" stroke="currentColor" stroke-width="1"/>
    <rect x="7" y="12" width="2" height="2" fill="none" stroke="currentColor" stroke-width="1"/>
  </symbol>
</svg>
